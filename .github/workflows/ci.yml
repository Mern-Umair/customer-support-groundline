name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          MONGODB_URI_TEST: ${{ secrets.MONGODB_URI_TEST }}
          # Optional real-provider eval gate: set the EVALS_REAL repository variable to "1" and add GEMINI_API_KEY.
          # Without them the eval runner test uses the offline stand-ins and the regression gate is skipped.
          EVALS_REAL: ${{ vars.EVALS_REAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: npm run build -w apps/web
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI_TEST }}
          AUTH_SECRET: ci-only-secret-not-used-in-prod

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          MONGODB_URI_TEST: ${{ secrets.MONGODB_URI_TEST }}
          AUTH_SECRET: ci-only-secret-not-used-in-prod
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
